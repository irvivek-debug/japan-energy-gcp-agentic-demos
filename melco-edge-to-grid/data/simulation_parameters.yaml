# ---------------------------------------------------------------------------------------------
# Market and contract values. Where a value is a real-world market fact it must match
# docs/research/MARKET_FACTS.md; everything else is a stated demo assumption.
# ---------------------------------------------------------------------------------------------
market:
  jepx_area: "Tokyo"
  jepx_start: "2026-06-01"      # extended back so July savings can be computed from prices
  # Tokyo-area FY2026 summer regime [MARKET_FACTS s.1.3-1.4]: Aug 2026 mean 21.2 JPY/kWh, summer trough
  # ~17.2 (06-07h) and peak ~27.9 (18-19h). Shape = a + b * FY2025 summer hourly shape (mapped trough/peak).
  fy2025_summer_hourly: [11.7,11.3,11.2,11.2,11.2,11.1,10.8,10.7,10.7,11.7,11.5,11.9,11.3,13.7,14.9,16.0,18.3,18.5,18.3,17.1,15.6,13.9,13.4,12.2]
  fy2026_summer_trough: 17.2
  fy2026_summer_peak: 27.9
  june_level_factor: 0.93       # Jun 2026 Tokyo mean 20.0 vs Aug 21.2
  july_level_factor: 0.99       # Jul 2026 Tokyo mean 19.9
  daily_log_sd: 0.169           # FY2026 day-over-day log-return SD
  weekend_discount: 2.5         # JPY/kWh (FY2025 -2.03, scaled to the FY2026 level)
  heatwave_evening_peaks: {"2026-08-17": 36.0, "2026-08-18": 44.5, "2026-08-20": 51.0}
  # Synthetic scenario spike on the demo day. FY2026 real Tokyo max to date is 64.28 JPY/kWh (2026-04-28);
  # the scenario stays below it on purpose [MARKET_FACTS s.1.6].
  spike_today_slots: {32: 29.6, 33: 31.4, 34: 34.2, 35: 44.8, 36: 55.6, 37: 62.4, 38: 60.9, 39: 51.3, 40: 33.5}
  intraday_premium_mean: 1.07   # FY2026 intraday premium over system price [MARKET_FACTS s.2]
  intraday_premium_sd: 4.63
  intraday_spike_premium_today: 0.10
  imbalance_minus_spot_mean: -2.5
  imbalance_minus_spot_sd: 9.42 # FY2026 [MARKET_FACTS s.3]
  # Scarcity-adjusted imbalance price vs wide-area reserve margin [MARKET_FACTS s.3]:
  # 0 at B=10 %, D=45 JPY/kWh at B'=8 %, C=200 JPY/kWh at A=3 % (C=200 until 2026-09-30; 300 from 2026-10-01).
  scarcity_B_pct: 10.0
  scarcity_Bp_pct: 8.0
  scarcity_A_pct: 3.0
  scarcity_D: 45.0
  scarcity_C: 200.0
  scarcity_C_from_2026_10_01: 300.0
  reserve_margin_today: {33: 9.1, 34: 8.4, 35: 7.2, 36: 6.1, 37: 5.4, 38: 5.6, 39: 6.6, 40: 8.3}
  spike_threshold_jpy_kwh: 35.0

tariff:
  contract_id: "SPC-ATSUGI-MKT-2026"
  # Market-linked energy price per slot = spot * loss_factor + service_fee + wheeling_energy + capacity + renewable levy
  loss_factor: 1.04                     # ESTIMATE [MARKET_FACTS s.5.4]
  service_fee_jpy_kwh: 2.0              # ESTIMATE, range 1-3 [MARKET_FACTS s.5.4]
  wheeling_energy_jpy_kwh: 0.91         # TEPCO PG EHV standard until 2026-10-31 [MARKET_FACTS s.5.1]
  wheeling_basic_jpy_kw_month: 423.39   # TEPCO PG EHV standard until 2026-10-31 [MARKET_FACTS s.5.1]
  capacity_contribution_jpy_kwh: 0.94   # FY2026 Tokyo ESTIMATE [MARKET_FACTS s.5.2]
  renewable_levy_jpy_kwh: 4.18          # FY2026 [MARKET_FACTS s.5.3]
  demand_charge_jpy_kw_month: 1500      # retailer basic charge; TEPCO EP market-linked plan FY2026 level [MARKET_FACTS s.5.4]
  demand_charge_basis: "monthly maximum 30-min demand (demo assumption)"
  deviation_band_pct: 7.5
  gate_closure_min: 60                  # plan revisions until 1 h before delivery [MARKET_FACTS s.3]
  dr_program: "Aggregator summer DR program (July-September), day-of dispatch"
  dr_energy_rate_jpy_kwh: 45.0          # demo assumption
  dr_penalty_rate_jpy_kwh: 60.0         # demo assumption
  dr_availability_jpy_kw_month: 650     # demo assumption (paid July-September)
  dr_contracted_capacity_kw: 3000
  dr_payment_cap_ratio: 1.0
  gain_share_pct: 25.0
  gain_share_pct_range: [20.0, 30.0]
  baas_fee_jpy_month: 3000000           # 8 MWh x 60k JPY/kWh competitive C&I procurement, 1/3 subsidy, 15 y at 3 %, O&M 1.5 %/yr (PRD assumption ledger)
