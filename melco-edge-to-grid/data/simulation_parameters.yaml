# Simulation parameters for the Edge-to-Grid Factory Energy Copilot demo.
# Every number the generator uses lives here. Market-facing values cite docs/research/MARKET_FACTS.md
# (see the `market` block); plant-physics values are engineering assumptions stated in docs/PRD.md.
seed: 20260819
demo_now: "2026-08-19T13:30"

plant:
  name: "Sagami Precision Components, Atsugi Plant"
  location: "Atsugi, Kanagawa (TEPCO Power Grid service area)"
  products: "SiC power modules and automotive ECUs"
  contracted_demand_kw: 16000
  voltage_class: "extra-high voltage (66 kV receiving)"
  transformer_loss_pct: 1.0

periods:
