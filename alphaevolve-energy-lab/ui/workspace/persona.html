<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My role · Workspace · AlphaEvolve Energy Lab</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="../lab.css">
</head>
<body data-page="workspace" data-screen="persona">
<main class="wrap" id="main">

  <section class="hero ws-head reveal">
    <div class="eyebrow">Workspace · My role</div>
    <h1 id="role-title">My role</h1>
    <p class="lede" id="role-lede"></p>
    <div class="controls" style="margin-top:12px"><label class="fl" for="role-select" style="flex:0 1 420px">Role<select class="field" id="role-select"></select></label></div>
  </section>
  <div class="role-layout">
    <div id="panel"></div>
    <aside class="sidecar card" id="sidecar" aria-label="Chat with the Lab Analyst">
      <div class="sidecar-tag">Live · the Lab Analyst</div>
      <div class="transcript" id="transcript" role="log" aria-live="polite"></div>
      <form class="composer" id="composer">
        <label class="sr-only" for="chat-input">Your question</label>
        <textarea class="field" id="chat-input" rows="2" placeholder="Ask about a run, a rule or the market"></textarea>
        <button class="btn primary" type="submit" id="chat-send">Ask</button>
      </form>
      <details class="drawer" style="margin-top:12px"><summary>Trace<span class="hint">tool calls, as they happen</span></summary><div class="body"><div class="console" id="trace" role="log"></div></div></details>
    </aside>
  </div>

  <div id="prov"></div>
</main>

<script src="../shell.js"></script>
<script src="../motion.js"></script>
<script src="../signoff.js"></script>
<script src="../lab.js"></script>
<script src="persona.js"></script>
</body>
</html>
